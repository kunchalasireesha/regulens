services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regulens
      POSTGRES_PASSWORD: regulens
      POSTGRES_DB: regulens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulens -d regulens"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
